<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello World!</title>
    <!-- Icon for the head -->
    <link rel="icon" href="assets/smile.ico">
</head>
<body style="background-color: rgb(141, 184, 185);">
    <!-- Center the elements -->
    <center>
        <!-- Main Header -->
        <h1 style="max-width:40%; background-color: cadetblue; border:5px solid rgb(52, 94, 95)">Hello World!</h1>
        <!-- Cat image -->
        <img style="border:5px solid rgb(52, 94, 95)" src="assets/cat.jpg" alt="Image of a cat">
        <!-- Paragraph element -->
        <p style="max-width:10%; background-color: cadetblue; border:5px solid rgb(52, 94, 95);">This is an image of a cat</p>
    </center>
</body>
</html>
